<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="heroe.css">
</head>
<body>
<div class="container-form">
    <div class="form-content">
        <h2>Formulario</h2>
        <form id="modal-form">
            <div class="form-group">
                <label for="codigo">Código</label>
                <input type="number" min="1" id="codigo" placeholder="Ingrese el código" required />
            </div>
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ingrese el nombre" required />
            </div>
            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" id="edad" placeholder="Ingrese la edad" required />
            </div>
            <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" placeholder="Ingrese la ciudad" required />
            </div>
            <div class="form-group">
                <label for="inputImage">Imagen</label>
                <input type="file" accept="image/*" id="inputImage" />
            </div>
            <div id="previewImage">
                <img id="imagenPrevia" class="vistaPrevia" src="" alt="">
            </div>
            <button type="submit" id="btn" class="save-btn">Guardar</button>
        </form>
    </div>
</div>



<script type="module" src="/src/vista/heroe.ts"></script>

</body>
</html>
